[build-system]
requires = ["setuptools>=61.0", "pytest>=7.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonization-framework"
version = "0.0.1"
authors = [
  { name="jkyu", email="jkyu@stanford.edu" },
]
description = "General Purpose Harmonization Framework"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2.3",
    "pint>=0.24.3",
    "pyyaml>=6.0.2",
    "fastapi>=0.115.6",
    "uvicorn>=0.30.6",
    "pydantic>=2.10.6",
]

[project.scripts]
harmonization-sidecar = "harmonization_framework.api.sidecar:main"
harmonize = "harmonization_framework.cli:main"
